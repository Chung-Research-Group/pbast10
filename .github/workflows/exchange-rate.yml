name: Verify fixed registration fees

# Fees are fixed by KIChE. Do not schedule FX fetches or automated fee changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify fixed payment amounts
        run: node scripts/test_exchange_rate.mjs
      - name: Validate site
        run: python scripts/check_site.py
