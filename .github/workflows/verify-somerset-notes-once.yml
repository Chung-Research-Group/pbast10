name: Verify Somerset booking notes (one-time)
on:
  push:
    branches: [qa/somerset-booking-notes-no-deadline]
    paths: [.github/workflows/verify-somerset-notes-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdd3b243cba954086202ee21d5e6d5b882ba15f6
          persist-credentials: false
      - name: Existing site checks and negative regression cases
        run: |
          python3 scripts/check_site.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('accommodation.html')
          original = p.read_text()
          cases = {
              'visible deadline': original.replace('</main>', '<p>April 30, 2027</p></main>'),
              'metadata deadline': original.replace('Reserve Somerset Palace Seoul for PBAST10.', 'Reserve Somerset Palace Seoul for PBAST10 by April 30, 2027.'),
              'missing hotel responsibility': original.replace('All reservations are handled directly by the hotel.', 'Reservation information.'),
          }
          try:
              for name, altered in cases.items():
                  assert altered != original, name
                  p.write_text(altered)
                  result = subprocess.run(['python3', 'scripts/check_site.py'], capture_output=True, text=True)
                  assert result.returncode != 0, 'Regression was not detected: ' + name
                  assert ('unagreed reservation deadline remains' if 'deadline' in name else 'missing organizer-provided reservation note') in result.stdout, result.stdout
                  print('Negative case detected:', name)
          finally:
              p.write_text(original)
          PY
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pbast-qa" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/pbast-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify rendered copy, layout, and original downloads
        shell: bash
        run: |
          mkdir -p qa-evidence
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/pbast-http.log" 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID"' EXIT
          export NODE_PATH="$RUNNER_TEMP/pbast-qa/node_modules"
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({acceptDownloads: true, reducedMotion: 'reduce'});
            const page = await context.newPage();
            const errors = [];
            const observations = [];
            page.on('pageerror', e => errors.push(e.message));
            const source = fs.readFileSync('accommodation.html', 'utf8');
            const required = [
              'Discounted room rates are available on a first-come, first-served basis and subject to room availability. The number of rooms allocated at the special rate is limited. Early reservation is strongly recommended.',
              'All reservations are handled directly by the hotel.',
              'Cancellation and payment policies are subject to the hotel’s terms stated in the reservation form.',
              'The conference organizers are not responsible for individual booking changes or cancellations.'
            ];
            for (const width of [390, 768, 1440]) {
              await page.setViewportSize({width, height: 1000});
              const response = await page.goto('http://127.0.0.1:8765/accommodation.html', {waitUntil: 'networkidle'});
              assert.equal(response.status(), 200);
              await page.evaluate(() => document.fonts.ready);
              const text = (await page.locator('main').innerText()).replace(/\s+/g, ' ');
              for (const copy of required) assert(text.includes(copy), copy);
              assert(!/April\s+30|30\s+Apr|2027-04-30|reservation form deadline/i.test(source));
              assert.equal(await page.getByRole('heading', {name: 'Special Conference Rates', exact: true}).count(), 1);
              assert.equal(await page.getByRole('heading', {name: 'Important Notes', exact: true}).count(), 1);
              assert.equal(await page.locator('.hotel-card').count(), 0);
              assert.equal(await page.locator('.reservation-downloads a[download]').count(), 2);
              assert.equal(await page.locator('.reservation-contacts a[href^="mailto:"]').count(), 2);
              const metrics = await page.evaluate(() => ({width: innerWidth, scrollWidth: document.documentElement.scrollWidth, imagesLoaded: [...document.images].every(img => img.complete && img.naturalWidth > 0)}));
              assert(metrics.scrollWidth <= width + 1, JSON.stringify(metrics));
              assert(metrics.imagesLoaded);
              await page.screenshot({path: 'qa-evidence/accommodation-' + width + '.png', fullPage: true});
              observations.push(metrics);
            }
            for (const [ext, hash] of Object.entries({pdf: '0c2de478ea2a31e27a03a8ff765c88bbb79b1c1cae119b7454d7b777256d04d3', docx: 'd2fda493f3d9cb8ddc4c6b11c45e0fa1fe4d9833506527a39cfb542986850091'})) {
              const waiting = page.waitForEvent('download');
              await page.locator('.reservation-downloads a[href$=".' + ext + '"]').click();
              const download = await waiting;
              assert.equal(await download.failure(), null);
              const bytes = fs.readFileSync(await download.path());
              assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), hash);
              observations.push({download: ext, bytes: bytes.length, sha256: hash});
            }
            assert.deepEqual(errors, []);
            fs.writeFileSync('qa-evidence/results.json', JSON.stringify({status: 'passed', sourceCommit: 'fdd3b243cba954086202ee21d5e6d5b882ba15f6', observations, pageErrors: errors}, null, 2));
            await browser.close();
          })().catch(error => {console.error(error); process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somerset-no-deadline-qa
          path: qa-evidence/
          retention-days: 3
