name: Somerset reservation verification (one-time)
on:
  push:
    branches: [review/somerset-only-reservations]
    paths: [.github/workflows/import-somerset-forms.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'mtap-research'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing site checks
        run: |
          python3 scripts/check_site.py
          node scripts/test_footer_date.mjs
          node scripts/test_exchange_rate.mjs
          node scripts/test_sheets_sync.mjs
      - name: Install browser for responsive verification
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify hotel page and downloadable original files
        run: |
          mkdir -p /tmp/somerset-review
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/somerset-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/accommodation.html', timeout=2).close()
                  break
              except OSError:
                  time.sleep(.25)
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (390, 768, 1440):
                  page = browser.new_page(viewport={'width':width, 'height':1000}, device_scale_factor=1)
                  page.goto('http://127.0.0.1:8765/accommodation.html', wait_until='networkidle')
                  page.evaluate('document.fonts.ready')
                  assert page.locator('h1').inner_text() == 'Stay at Somerset Palace Seoul'
                  assert page.locator('.recommended-hotels').count() == 0
                  assert page.locator('.hotel-card').count() == 0
                  assert page.locator('a[href="mailto:christine.park@the-ascott.com"]').count() == 1
                  assert page.locator('a[href="mailto:enquiry.seoul@the-ascott.com"]').count() == 1
                  assert page.locator('a[href="tel:+82267308002"]').count() == 1
                  assert page.locator('a[href="tel:+82267308888"]').count() == 1
                  assert page.locator('.reservation-downloads a[download]').count() == 2
                  dimensions = page.evaluate('({width:innerWidth, scroll:document.documentElement.scrollWidth})')
                  assert dimensions['scroll'] <= dimensions['width']+1, dimensions
                  assert page.locator('.featured-hotel-photo img').evaluate('(img) => img.complete && img.naturalWidth > 0')
                  page.screenshot(path=f'/tmp/somerset-review/accommodation-{width}.png', full_page=True)
                  results.append({'viewport':width, 'overflow':False, 'checks':'passed'})
                  page.close()
              page = browser.new_page(accept_downloads=True)
              page.goto('http://127.0.0.1:8765/accommodation.html', wait_until='networkidle')
              expected = {
                  'pdf':'0c2de478ea2a31e27a03a8ff765c88bbb79b1c1cae119b7454d7b777256d04d3',
                  'docx':'d2fda493f3d9cb8ddc4c6b11c45e0fa1fe4d9833506527a39cfb542986850091',
              }
              for extension, digest in expected.items():
                  with page.expect_download() as download_info:
                      page.locator(f'.reservation-downloads a[href$=".{extension}"]').click()
                  download = download_info.value
                  assert download.suggested_filename == f'PBAST10_Somerset_Palace_Reservation_Form_2027.{extension}'
                  assert hashlib.sha256(Path(download.path()).read_bytes()).hexdigest() == digest
                  results.append({'download':extension, 'original_sha256_verified':True})
              browser.close()
          Path('/tmp/somerset-review/results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somerset-reservation-review
          path: /tmp/somerset-review/
          retention-days: 3
