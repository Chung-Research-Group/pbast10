name: Somerset accommodation checks
on:
  push:
    branches: [update/somerset-only-accommodation]
    paths: [.github/workflows/import-somerset-forms.yml]
permissions:
  contents: read
jobs:
  check-accommodation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/somerset-only-accommodation
      - name: Run site regressions
        run: |
          python3 scripts/check_site.py
          node scripts/test_footer_date.mjs
          node scripts/test_exchange_rate.mjs
          node scripts/test_sheets_sync.mjs
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Check responsive page and reservation downloads
        run: |
          python3 - <<'PY'
          import hashlib, http.server, json, pathlib, threading
          from playwright.sync_api import sync_playwright
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 8765), http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          output = pathlib.Path('somerset-qa')
          output.mkdir(exist_ok=True)
          report = {'viewports': [], 'downloads': []}
          try:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch()
                  for width in (320, 390, 768, 1024, 1440, 1800):
                      page = browser.new_page(viewport={'width': width, 'height': 1000}, device_scale_factor=1)
                      response = page.goto('http://127.0.0.1:8765/accommodation.html', wait_until='networkidle')
                      assert response.status == 200
                      page.evaluate('document.fonts.ready')
                      overflow = page.evaluate('document.documentElement.scrollWidth > innerWidth')
                      assert not overflow, f'Page overflows at {width}px'
                      assert page.locator('.featured-hotel').count() == 1
                      assert page.locator('.recommended-hotels').count() == 0
                      assert page.locator('a[download]').count() == 2
                      assert page.locator('.featured-hotel-photo img').evaluate('(img) => img.complete && img.naturalWidth > 0')
                      for email in ('christine.park@the-ascott.com', 'enquiry.seoul@the-ascott.com'):
                          element = page.locator('a[href="mailto:' + email + '"]')
                          assert element.is_visible()
                          box = element.bounding_box()
                          assert box['x'] >= 0 and box['x'] + box['width'] <= width + 1, (width, email)
                      if width == 390:
                          page.locator('.nav-toggle').click()
                          assert page.locator('.nav-toggle').get_attribute('aria-expanded') == 'true'
                          page.locator('.nav-toggle').click()
                      page.screenshot(path=str(output / f'accommodation-{width}.png'), full_page=True)
                      report['viewports'].append({'width': width, 'noOverflow': True, 'contactsVisible': True, 'downloadLinks': 2})
                      page.close()
                  context = browser.new_context()
                  expected = {
                      'pdf': '0c2de478ea2a31e27a03a8ff765c88bbb79b1c1cae119b7454d7b777256d04d3',
                      'docx': 'd2fda493f3d9cb8ddc4c6b11c45e0fa1fe4d9833506527a39cfb542986850091',
                  }
                  for extension, digest in expected.items():
                      response = context.request.get(f'http://127.0.0.1:8765/assets/documents/PBAST10_Somerset_Palace_Reservation_Form_2027.{extension}')
                      assert response.status == 200
                      data = response.body()
                      assert hashlib.sha256(data).hexdigest() == digest
                      report['downloads'].append({'format': extension, 'bytes': len(data), 'originalHashMatches': True})
                  browser.close()
          finally:
              server.shutdown()
              (output / 'report.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2))
          PY
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somerset-accommodation-preview
          path: somerset-qa/
          retention-days: 7
