name: Temporary Somerset browser verification
on:
  push:
    branches: [staging/somerset-form-import-20260919]
    paths: [.github/workflows/import-somerset-forms-temporary.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff71a16ce146ca93e7d58bbacdb4a46cfc169743
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and original form integrity
        run: python3 scripts/check_site.py
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pbast-qa" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/pbast-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify final Netlify preview and original form downloads
        env:
          NODE_PATH: ${{ runner.temp }}/pbast-qa/node_modules
        shell: bash
        run: |
          mkdir -p qa-evidence
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const base = 'https://deploy-preview-91--pbast10-pacific-basin-conference-on-adso-cd-cb27cc3e73.netlify.app';
            const browser = await chromium.launch();
            const errors = [];
            const observations = [];
            const context = await browser.newContext({acceptDownloads:true});
            const page = await context.newPage();
            page.on('pageerror', error => errors.push(error.message));
            for (const width of [390,768,1440]) {
              await page.setViewportSize({width,height:1000});
              const response = await page.goto(base+'/accommodation.html',{waitUntil:'networkidle'});
              assert(response.ok());
              await page.evaluate(()=>document.fonts.ready);
              assert.equal(await page.locator('h1').innerText(),'Somerset Palace Seoul');
              assert.equal(await page.locator('.hotel-card').count(),0);
              assert.equal(await page.locator('.reservation-downloads a').count(),2);
              assert(await page.locator('a[href="mailto:christine.park@the-ascott.com"]').isVisible());
              assert(await page.locator('a[href="mailto:enquiry.seoul@the-ascott.com"]').isVisible());
              const metrics = await page.evaluate(()=>({width:window.innerWidth,scroll:document.documentElement.scrollWidth,imageOk:[...document.images].every(i=>i.complete&&i.naturalWidth>0),shortcutColor:getComputedStyle(document.querySelector('.reservation-pending a')).color}));
              assert(metrics.scroll<=metrics.width+1,'Horizontal overflow: '+JSON.stringify(metrics));
              assert(metrics.imageOk);
              assert.equal(metrics.shortcutColor,'rgb(255, 255, 255)');
              await page.screenshot({path:'qa-evidence/accommodation-'+width+'.png',fullPage:true});
              observations.push(metrics);
            }
            for(const [ext,expected] of Object.entries({pdf:'0c2de478ea2a31e27a03a8ff765c88bbb79b1c1cae119b7454d7b777256d04d3',docx:'d2fda493f3d9cb8ddc4c6b11c45e0fa1fe4d9833506527a39cfb542986850091'})){
              const wait=page.waitForEvent('download');
              await page.locator('.reservation-downloads a[href$=".'+ext+'"]').click();
              const download=await wait;
              assert.equal(await download.failure(),null);
              const bytes=fs.readFileSync(await download.path());
              assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),expected);
              observations.push({form:ext,bytes:bytes.length,sha256:expected});
            }
            assert.deepEqual(errors,[]);
            fs.writeFileSync('qa-evidence/results.json',JSON.stringify({status:'passed',base,sourceCommit:'ff71a16ce146ca93e7d58bbacdb4a46cfc169743',observations,pageErrors:errors},null,2));
            console.log(JSON.stringify(observations,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somerset-accommodation-final-preview
          path: qa-evidence
          retention-days: 3
