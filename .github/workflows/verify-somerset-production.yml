name: Verify published Somerset page
on:
  push:
    branches: [update/somerset-only-accommodation]
    paths: [.github/workflows/verify-somerset-production.yml]
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify live page and original form downloads
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright
          out = pathlib.Path('production-check')
          out.mkdir()
          report = {'page': 'https://pbast10.org/accommodation.html', 'viewports': [], 'downloads': []}
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              context = browser.new_context()
              page = context.new_page(viewport={'width': 1440, 'height': 1000})
              response = page.goto(report['page'], wait_until='networkidle')
              assert response.status == 200
              text = page.locator('main').inner_text()
              for required in ('Somerset Palace Seoul', 'Christine Park', 'christine.park@the-ascott.com', 'enquiry.seoul@the-ascott.com', 'April 30, 2027'):
                  assert required in text, required
              for retired in ('H Avenue Hotel', 'Hotel The Designers', 'Holiday Inn Express', 'L7 Hongdae', 'Brown Suites', 'Ever8'):
                  assert retired not in text, retired
              assert page.locator('a[download]').count() == 2
              for width in (320, 390, 768, 1024, 1440):
                  page.set_viewport_size({'width': width, 'height': 1000})
                  page.evaluate('document.fonts.ready')
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'), f'Overflow at {width}'
                  assert page.locator('.featured-hotel-photo img').evaluate('(img) => img.complete && img.naturalWidth > 0')
                  page.screenshot(path=str(out / f'accommodation-live-{width}.png'), full_page=True)
                  report['viewports'].append({'width': width, 'noOverflow': True})
              expected = {
                  'pdf': '0c2de478ea2a31e27a03a8ff765c88bbb79b1c1cae119b7454d7b777256d04d3',
                  'docx': 'd2fda493f3d9cb8ddc4c6b11c45e0fa1fe4d9833506527a39cfb542986850091',
              }
              for extension, digest in expected.items():
                  link = page.locator(f'a[download][href$=".{extension}"]')
                  href = urljoin(page.url, link.get_attribute('href'))
                  assert href == f'https://pbast10.org/assets/documents/PBAST10_Somerset_Palace_Reservation_Form_2027.{extension}'
                  result = context.request.get(href)
                  data = result.body()
                  assert result.status == 200, (href, result.status)
                  assert hashlib.sha256(data).hexdigest() == digest, href
                  report['downloads'].append({'url': href, 'status': result.status, 'bytes': len(data), 'contentType': result.headers.get('content-type'), 'sha256': digest})
              report['actualPageUrl'] = page.url
              browser.close()
          (out / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somerset-production-check
          path: production-check/
          retention-days: 7
