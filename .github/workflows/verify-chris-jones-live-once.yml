name: Verify published Chris Jones portrait
on:
  push:
    branches: [content/chris-jones-portrait-20260919]
    paths: [.github/workflows/verify-chris-jones-live-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install isolated browser tools
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify the live portrait, image bytes, and responsive layout
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          from playwright.sync_api import sync_playwright
          out = pathlib.Path('live-portrait-qa')
          out.mkdir()
          results, errors = [], []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width':1440,'height':1000})
              page = context.new_page()
              page.on('pageerror', lambda error: errors.append(str(error)))
              for width in (390,768,1440):
                  page.set_viewport_size({'width':width,'height':1000})
                  response = page.goto('https://pbast10.org/speakers.html', wait_until='networkidle', timeout=60000)
                  assert response.status == 200
                  page.evaluate('document.fonts.ready')
                  card = page.locator('article.speaker-profile').filter(has_text='Jones, Christopher W.')
                  assert card.count() == 1
                  image = card.locator('.speaker-portrait img')
                  assert image.get_attribute('src') == 'assets/speakers/chris-jones-20260919.webp'
                  assert image.is_visible()
                  metrics = image.evaluate('(i) => ({loaded:i.complete, width:i.naturalWidth, height:i.naturalHeight, source:i.currentSrc, position:getComputedStyle(i).objectPosition})')
                  assert metrics['loaded'] and metrics['width'] == 800 and metrics['height'] == 1238
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1')
                  card.screenshot(path=str(out / ('chris-jones-live-' + str(width) + '.png')))
                  results.append({'viewport':width,'image':metrics,'noHorizontalOverflow':True})
              asset = context.request.get('https://pbast10.org/assets/speakers/chris-jones-20260919.webp')
              assert asset.status == 200
              digest = hashlib.sha256(asset.body()).hexdigest()
              assert digest == 'af99a6576d081d7fc1343e2092aeb8d7c12af4d9db006ddfefa5e23676d228a9'
              assert not errors, errors
              report = {'status':'passed','url':page.url,'observations':results,'servedImageSHA256':digest,'pageErrors':errors}
              (out / 'report.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report,indent=2))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chris-jones-live-verification
          path: live-portrait-qa/
          retention-days: 3
